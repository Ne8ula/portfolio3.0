          - paragraph [ref=f1e205]:
            - text: The
            - link "Model Context Protocol (MCP)" [ref=f1e206] [cursor=pointer]:
              - /url: https://modelcontextprotocol.io/
            - text: is an open standard that lets AI assistants call external tools and retrieve structured context. The Meshy MCP server wraps the Meshy REST API as a set of tools your agent can invoke — generate a model, check a task, download the result — without hand-writing HTTP code.
          - paragraph [ref=f1e207]:
            - text: The MCP server is open source and published on npm as
            - link "@meshy-ai/meshy-mcp-server" [ref=f1e208] [cursor=pointer]:
              - /url: https://www.npmjs.com/package/@meshy-ai/meshy-mcp-server
