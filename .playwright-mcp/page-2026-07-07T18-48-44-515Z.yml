          - generic [ref=f1e372]:
            - generic [ref=f1e373]:
              - term [ref=f1e374]: Is the MCP server stateless?
              - definition [ref=f1e375]: Yes. Your MESHY_API_KEY is used per request and never persisted on the server side.
            - generic [ref=f1e376]:
              - term [ref=f1e377]: Does MCP cost the same as the REST API?
              - definition [ref=f1e378]: Yes — every MCP tool call maps to a single REST call and consumes credits at the exact same rate. See the Pricing page for the full matrix.
            - generic [ref=f1e379]:
              - term [ref=f1e380]: What are the rate limits?
              - definition [ref=f1e381]: The MCP server shares the same rate-limit plane as the REST API. See the Rate Limits page for per-tier limits.
            - generic [ref=f1e382]:
              - term [ref=f1e383]: What Meshy data can the MCP access?
              - definition [ref=f1e384]: Only what the MESHY_API_KEY can access via REST. Scopes and permissions are identical.
            - generic [ref=f1e385]:
              - term [ref=f1e386]: How do I report issues?
              - definition [ref=f1e387]: "File an issue at the meshy-mcp-server repository: https://github.com/meshy-dev/meshy-mcp-server/issues"
