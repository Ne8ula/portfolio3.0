              - link "https://www.meshy.ai/settings/api" [ref=f1e218] [cursor=pointer]:
                - /url: https://www.meshy.ai/settings/api
              - text: . The MCP server reads it from the
              - code [ref=f1e219]: MESHY_API_KEY
              - text: environment variable.
