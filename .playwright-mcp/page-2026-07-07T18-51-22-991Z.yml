              - heading "Detailed Breakdown" [level=2] [ref=f14e148]
              - heading "3D AI Studio" [level=3] [ref=f14e149]
              - paragraph [ref=f14e150]:
                - link "3D AI Studio's API" [ref=f14e151] [cursor=pointer]:
                  - /url: https://www.3daistudio.com/Platform
                - text: is unique in the market because it bundles multiple generation models, image generation, texturing, mesh tools, and pre-built workflows into a single REST API with one authentication system and one credit wallet.
              - paragraph [ref=f14e152]:
                - strong [ref=f14e153]: "3D Generation models available:"
              - list [ref=f14e154]:
                - listitem [ref=f14e155]:
                  - strong [ref=f14e156]:
                    - link "Hunyuan 3D" [ref=f14e157] [cursor=pointer]:
                      - /url: https://www.3daistudio.com/Platform/API/Hunyuan3D
                  - text: (Tencent) - Pro edition (60-100 credits, 3-6 min) and Rapid edition (35-55 credits, 2-3 min). Supports text-to-3D, image-to-3D, and multi-view input. Model versions 3.0 and 3.1 with four generation modes (Normal, LowPoly, Geometry, Sketch). Configurable polygon count up to 1.5M. The latest
                  - link "Hunyuan 3D 3.5" [ref=f14e158] [cursor=pointer]:
                    - /url: https://www.3daistudio.com/Platform/API/Hunyuan3D35
                  - text: brings under 60s generation and up to 8K PBR textures.
                - listitem [ref=f14e159]:
                  - strong [ref=f14e160]:
                    - link "TRELLIS.2" [ref=f14e161] [cursor=pointer]:
                      - /url: https://www.3daistudio.com/Platform/API/Trellis2
                  - text: (Microsoft) - Image-to-3D with PBR materials from a single photo. 15-55 credits depending on resolution and textures. Generation in 20 seconds to 4 minutes. Based on the TRELLIS.2-4B model.
              - paragraph [ref=f14e162]:
                - strong [ref=f14e163]: "Beyond 3D generation:"
              - paragraph [ref=f14e164]: "This is where 3D AI Studio separates itself. No other single API offers:"
              - list [ref=f14e165]:
                - listitem [ref=f14e166]:
                  - strong [ref=f14e167]:
                    - link "Image generation" [ref=f14e168] [cursor=pointer]:
                      - /url: https://www.3daistudio.com/Platform/API/ImageGeneration
                  - text: with 4 models (Gemini 3 Pro, 3.1 Flash, 2.5 Flash, Seedream V5 Lite) - from 5 to 80 credits per image
                - listitem [ref=f14e169]:
                  - strong [ref=f14e170]:
                    - link "AI texturing" [ref=f14e171] [cursor=pointer]:
                      - /url: https://www.3daistudio.com/Platform/API/Texturing
                  - text: "- apply PBR textures to any 3D model from text or image reference (80 credits)"
                - listitem [ref=f14e172]:
                  - strong [ref=f14e173]:
                    - link "Mesh tools" [ref=f14e174] [cursor=pointer]:
                      - /url: https://www.3daistudio.com/Platform/API/MeshTools
                  - text: "- convert formats, repair geometry, hollow for printing, optimize for web, render previews, bake textures (5-90 credits)"
                - listitem [ref=f14e175]:
                  - strong [ref=f14e176]:
                    - link "3D printing pipeline" [ref=f14e177] [cursor=pointer]:
                      - /url: https://www.3daistudio.com/Platform/API/3DPrinting
                  - text: "- generate, repair, hollow, scale, and export print-ready STL in one workflow"
                - listitem [ref=f14e178]:
                  - strong [ref=f14e179]: Miniature figurine flow
                  - text: "- photo to 3D-printable figurine in one API call (200-300 credits)"
              - paragraph [ref=f14e180]:
                - strong [ref=f14e181]: "Pricing:"
                - text: Pay-as-you-go credits. No subscription required. Credits last 365 days. Failed generations are not charged.
              - paragraph [ref=f14e182]:
                - strong [ref=f14e183]: "Best for:"
                - text: Teams that need a complete 3D pipeline - generation, post-processing, and delivery - through one API. Especially strong for 3D printing workflows and applications that need multiple AI models.
              - heading "Meshy" [level=3] [ref=f14e184]
              - paragraph [ref=f14e185]: Meshy is the most established pure-play 3D generation API. They've iterated rapidly and now offer their Meshy-6 model with good documentation and enterprise features.
              - paragraph [ref=f14e186]:
                - strong [ref=f14e187]: "Capabilities:"
              - list [ref=f14e188]:
                - listitem [ref=f14e189]: Text-to-3D and image-to-3D
                - listitem [ref=f14e190]: AI retexturing (change textures on existing models)
                - listitem [ref=f14e191]: PBR materials
                - listitem [ref=f14e192]: Configurable polygon count up to 300K
                - listitem [ref=f14e193]: Unity and Unreal Engine plugins
              - paragraph [ref=f14e194]:
                - strong [ref=f14e195]: "Pricing:"
                - text: Credit-based subscriptions. Free (200 credits/month), Pro ($10/month, 1,000 credits), Studio ($30/month, 4,000 credits), Enterprise (custom). Text-to-3D costs 10 credits, image-to-3D costs 20-30 credits.
              - paragraph [ref=f14e196]:
                - strong [ref=f14e197]: "Strengths:"
                - text: Best documentation in the market. SOC2 + ISO 27001 certified (important for enterprise). Game engine plugins for Unity and Unreal. Test-mode API keys for development without spending credits.
              - paragraph [ref=f14e198]:
                - strong [ref=f14e199]: "Weaknesses:"
                - text: Single generation model - you're locked into Meshy's model quality. No multi-image input. No built-in post-processing tools (repair, conversion, optimization). No image generation.
              - paragraph [ref=f14e200]:
                - strong [ref=f14e201]: "Best for:"
                - text: Game studios that want a simple, well-documented API with strong security certifications and engine integrations.
              - heading "Tripo AI" [level=3] [ref=f14e202]
              - paragraph [ref=f14e203]: Tripo has pushed hard on generation speed and creative styling options. Their v3.0 model produces sculpture-level precision, and they offer unique style transforms.
              - paragraph [ref=f14e204]:
                - strong [ref=f14e205]: "Capabilities:"
              - list [ref=f14e206]:
                - listitem [ref=f14e207]: Text-to-3D, single image, and multi-image input
                - listitem [ref=f14e208]: "Style transforms: LEGO, voxel, Voronoi, Minecraft, cartoon, clay"
                - listitem [ref=f14e209]: Auto-animation and rigging
                - listitem [ref=f14e210]: Quad-based topology (ideal for games)
                - listitem [ref=f14e211]: Up to 2M polygons in Ultra mode
              - paragraph [ref=f14e212]:
                - strong [ref=f14e213]: "Pricing:"
                - text: API credits at $0.01/credit, 2,000 free credits on signup. Web subscriptions from $11.94/month.
              - paragraph [ref=f14e214]:
                - strong [ref=f14e215]: "Strengths:"
                - text: Creative styling options are unique in the market. Multi-image input for higher fidelity. Auto-animation saves significant post-processing time. v3.0 delivers up to 2M polygons.
              - paragraph [ref=f14e216]:
                - strong [ref=f14e217]: "Weaknesses:"
                - text: v3.0 is slower (~100 seconds vs v2.5's 25-30 seconds). API documentation is less polished than Meshy. No built-in mesh tools or image generation.
              - paragraph [ref=f14e218]:
                - strong [ref=f14e219]: "Best for:"
                - text: Creative teams and game developers who need stylized assets and auto-rigging. Strong for anyone building with visual variety (LEGO-style, voxel, etc.).
              - heading "Rodin (Hyper3D / Deemos)" [level=3] [ref=f14e220]
              - paragraph [ref=f14e221]: Rodin is the premium option. Their Gen-2 model has 10 billion parameters and produces the highest quality output in the market, but the pricing reflects that.
              - paragraph [ref=f14e222]:
                - strong [ref=f14e223]: "Capabilities:"
              - list [ref=f14e224]:
                - listitem [ref=f14e225]: Image-to-3D (primary), text prompts for texture guidance
                - listitem [ref=f14e226]: Gen-2 (10B parameters) and Gen-1.5 variants
                - listitem [ref=f14e227]: Bang! feature for model segmentation into subparts
                - listitem [ref=f14e228]: 4K textures with HighPack option
                - listitem [ref=f14e229]: Configurable quad/triangle topology, 2K-500K polygons
              - paragraph [ref=f14e230]:
                - strong [ref=f14e231]: "Pricing:"
                - text: Business subscription required ($120/month minimum) for API access. 0.5 credits per generation, +1 credit for HighPack (4K textures, high-poly).
              - paragraph [ref=f14e232]:
                - strong [ref=f14e233]: "Strengths:"
                - text: Highest quality output. 10B parameter model. Native 3D texture generation with no dead angles. Bang! segmentation is unique. Multiple output formats including USDZ.
              - paragraph [ref=f14e234]:
                - strong [ref=f14e235]: "Weaknesses:"
                - text: Expensive ($120/month minimum just for API access). Enterprise-only. Slower generation (2-3 minutes). No text-to-3D in the traditional sense.
              - paragraph [ref=f14e236]:
                - strong [ref=f14e237]: "Best for:"
                - text: Enterprise teams with budget who need the absolute highest quality 3D assets. Film, high-end product visualization, architecture.
              - heading "CSM (Common Sense Machines)" [level=3] [ref=f14e238]
              - paragraph [ref=f14e239]: CSM was acquired by Google in January 2026, which creates both opportunity and uncertainty for API users.
              - paragraph [ref=f14e240]:
                - strong [ref=f14e241]: "Capabilities:"
              - list [ref=f14e242]:
                - listitem [ref=f14e243]: Image-to-3D, multiview-to-3D, text-to-3D
                - listitem [ref=f14e244]: Image-to-Kit (unique - generates kits of 3D parts from one image)
                - listitem [ref=f14e245]: Enterprise AI retopology
              - paragraph [ref=f14e246]:
                - strong [ref=f14e247]: "Pricing:"
                - text: Credit-based. Free (1 credit on signup), Maker (100 credits/month), Creative Pro (400 credits/month). Additional credits at $0.20/credit.
              - paragraph [ref=f14e248]:
                - strong [ref=f14e249]: "Strengths:"
                - text: Image-to-Kit is a unique capability. Google acquisition signals strong future investment. Supports multiple geometry options.
              - paragraph [ref=f14e250]:
                - strong [ref=f14e251]: "Weaknesses:"
                - text: Post-acquisition uncertainty about the standalone API's future. Small credit allocations on free/maker tiers. CC BY 4.0 licensing unless on Creative Pro. Limited documentation.
              - paragraph [ref=f14e252]:
                - strong [ref=f14e253]: "Best for:"
                - text: Wait and see. The Google acquisition makes this an uncertain choice for production applications until the roadmap is clearer.
              - heading "Stability AI (Stable Fast 3D)" [level=3] [ref=f14e254]
              - paragraph [ref=f14e255]: Stability AI offers the fastest 3D generation in the market with SF3D, but it's a tradeoff.
              - paragraph [ref=f14e256]:
                - strong [ref=f14e257]: "Capabilities:"
              - list [ref=f14e258]:
                - listitem [ref=f14e259]: Image-to-3D only (no text input)
                - listitem [ref=f14e260]: SF3D generates in ~0.5 seconds
                - listitem [ref=f14e261]: Also offers SV3D, Stable Zero123, and TripoSR (collaboration with Tripo)
              - paragraph [ref=f14e262]:
                - strong [ref=f14e263]: "Pricing:"
                - text: 10 credits per generation via Stability API. Also available on fal.ai at $0.07/generation via TripoSR.
              - paragraph [ref=f14e264]:
                - strong [ref=f14e265]: "Strengths:"
                - text: Blazing fast. Sub-second generation is unmatched. Multiple model options through the API.
              - paragraph [ref=f14e266]:
                - strong [ref=f14e267]: "Weaknesses:"
                - text: GLB output only. No PBR materials (albedo only). No text-to-3D. No topology control. No post-processing tools. Stability AI's overall financial instability is a concern.
              - paragraph [ref=f14e268]:
                - strong [ref=f14e269]: "Best for:"
                - text: Applications where speed matters more than quality - rapid prototyping, real-time previews, interactive experiences where users expect instant feedback.
              - heading "Luma AI" [level=3] [ref=f14e270]
              - paragraph [ref=f14e271]: Luma takes a fundamentally different approach - NeRF-based capture from video rather than generative AI.
              - paragraph [ref=f14e272]:
                - strong [ref=f14e273]: "Capabilities:"
              - list [ref=f14e274]:
                - listitem [ref=f14e275]: Video walkthrough input (not text or single image)
                - listitem [ref=f14e276]: NeRF-based photorealistic reconstruction
                - listitem [ref=f14e277]: Embeddable interactive 3D viewers
              - paragraph [ref=f14e278]:
                - strong [ref=f14e279]: "Pricing:"
                - text: $1 per scene/object.
              - paragraph [ref=f14e280]:
                - strong [ref=f14e281]: "Strengths:"
                - text: Photorealistic for real-world object/scene digitization. Good for capturing existing products or environments.
              - paragraph [ref=f14e282]:
                - strong [ref=f14e283]: "Weaknesses:"
                - text: Not generative - you need video of a real object. 30 minutes per model. Coarse mesh output. Focus has shifted to Dream Machine (video generation).
              - paragraph [ref=f14e284]:
                - strong [ref=f14e285]: "Best for:"
                - text: Digitizing real-world products and environments. Not a competitor for generative 3D.
