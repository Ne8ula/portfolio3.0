              - heading "When to Use What" [level=2] [ref=f14e337]
              - paragraph [ref=f14e338]:
                - strong [ref=f14e339]: "\"I need the complete pipeline\""
                - text: "- 3D AI Studio. Generate, texture, repair, optimize, convert, render - all through one API. No other provider offers this."
              - paragraph [ref=f14e340]:
                - strong [ref=f14e341]: "\"I need the best documentation and security certifications\""
                - text: "- Meshy. SOC2 + ISO 27001, test-mode keys, comprehensive docs."
              - paragraph [ref=f14e342]:
                - strong [ref=f14e343]: "\"I need stylized assets with auto-rigging\""
                - text: "- Tripo AI. LEGO, voxel, cartoon styles with auto-animation."
              - paragraph [ref=f14e344]:
                - strong [ref=f14e345]: "\"I need the absolute highest quality, cost is not a concern\""
                - text: "- Rodin. 10B parameter model, 4K textures, enterprise-grade."
              - paragraph [ref=f14e346]:
                - strong [ref=f14e347]: "\"I need sub-second generation\""
                - text: "- Stability AI SF3D. 0.5 seconds, but albedo only."
              - paragraph [ref=f14e348]:
                - strong [ref=f14e349]: "\"I need to generate AND process 3D models for printing\""
