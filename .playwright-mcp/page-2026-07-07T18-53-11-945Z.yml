              - separator [ref=f21e460]
              - heading "What is MCP?" [level=2] [ref=f21e461]:
                - link "What is MCP?" [ref=f21e462] [cursor=pointer]:
                  - /url: "#what-is-mcp"
                  - text: What is MCP?#
              - paragraph [ref=f21e463]:
                - link "Model Context Protocol (MCP)" [ref=f21e464] [cursor=pointer]:
                  - /url: https://modelcontextprotocol.io
                - text: "is an open protocol that enables AI assistants to securely connect to external data sources and tools. With the shadcn MCP server, your AI assistant gains direct access to:"
              - list [ref=f21e465]:
                - listitem [ref=f21e466]:
                  - strong [ref=f21e467]: Browse Components
                  - text: "- List all available components, blocks, and templates from any configured registry"
                - listitem [ref=f21e468]:
                  - strong [ref=f21e469]: Search Across Registries
                  - text: "- Find specific components by name or functionality across multiple sources"
                - listitem [ref=f21e470]:
                  - strong [ref=f21e471]: Install with Natural Language
                  - text: "- Add components using simple conversational prompts like \"add a login form\""
                - listitem [ref=f21e472]:
                  - strong [ref=f21e473]: Support for Multiple Registries
                  - text: "- Access public registries, private company libraries, and third-party sources"
              - separator [ref=f21e474]
              - heading "How It Works" [level=2] [ref=f21e475]:
                - link "How It Works" [ref=f21e476] [cursor=pointer]:
                  - /url: "#how-it-works"
                  - text: How It Works#
              - paragraph [ref=f21e477]: The MCP server acts as a bridge between your AI assistant, component registries and the shadcn CLI.
              - list [ref=f21e478]:
                - listitem [ref=f21e479]:
                  - strong [ref=f21e480]: Registry Connection
                  - text: "- MCP connects to configured registries (shadcn/ui, private registries, third-party sources)"
                - listitem [ref=f21e481]:
                  - strong [ref=f21e482]: Natural Language
                  - text: "- You describe what you need in plain English"
                - listitem [ref=f21e483]:
                  - strong [ref=f21e484]: AI Processing
                  - text: "- The assistant translates your request into registry commands"
                - listitem [ref=f21e485]:
                  - strong [ref=f21e486]: Component Delivery
                  - text: "- Resources are fetched and installed in your project"
              - separator [ref=f21e487]
              - heading "Supported Registries" [level=2] [ref=f21e488]:
                - link "Supported Registries" [ref=f21e489] [cursor=pointer]:
                  - /url: "#supported-registries"
                  - text: Supported Registries#
              - paragraph [ref=f21e490]: The shadcn MCP server works out of the box with any shadcn-compatible registry.
              - list [ref=f21e491]:
                - listitem [ref=f21e492]:
                  - strong [ref=f21e493]: shadcn/ui Registry
                  - text: "- The default registry with all shadcn/ui components"
                - listitem [ref=f21e494]:
                  - strong [ref=f21e495]: Third-Party Registries
                  - text: "- Any registry following the shadcn registry specification"
                - listitem [ref=f21e496]:
                  - strong [ref=f21e497]: Private Registries
                  - text: "- Your company's internal component libraries"
                - listitem [ref=f21e498]:
                  - strong [ref=f21e499]: Namespaced Registries
                  - text: "- Multiple registries configured with"
                  - code [ref=f21e500]: "@namespace"
                  - text: syntax
              - separator [ref=f21e501]
              - heading "Configuration" [level=2] [ref=f21e502]:
                - link "Configuration" [ref=f21e503] [cursor=pointer]:
                  - /url: "#configuration"
                  - text: Configuration#
              - paragraph [ref=f21e504]: You can use any MCP client to interact with the shadcn MCP server. Here are the instructions for the most popular ones.
              - heading "Claude Code" [level=3] [ref=f21e505]:
                - link "Claude Code" [ref=f21e506] [cursor=pointer]:
                  - /url: "#claude-code"
                  - text: Claude Code#
              - paragraph [ref=f21e507]:
                - text: To use the shadcn MCP server with Claude Code, add the following configuration to your project's
                - code [ref=f21e508]: .mcp.json
                - text: "file:"
