                  - text: Configuring Registries#
              - paragraph [ref=f21e605]:
                - text: The MCP server supports multiple registries through your project's
                - code [ref=f21e606]: components.json
                - text: configuration. This allows you to access components from various sources including private registries and third-party providers.
              - paragraph [ref=f21e607]:
                - text: Configure additional registries in your
