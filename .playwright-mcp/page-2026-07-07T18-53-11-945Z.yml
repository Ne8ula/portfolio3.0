                - text: See the
                - link "Claude Code MCP documentation" [ref=f21e529] [cursor=pointer]:
                  - /url: https://code.claude.com/docs/en/mcp
                - text: for more details.
              - heading "Cursor" [level=3] [ref=f21e530]:
