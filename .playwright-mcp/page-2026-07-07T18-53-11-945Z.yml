                  - strong [ref=f21e683]: Verify Installation
                  - text: "- Ensure"
                  - code [ref=f21e684]: shadcn
                  - text: is installed in your project
                - listitem [ref=f21e685]:
                  - strong [ref=f21e686]: Check Network
                  - text: "- Confirm you can access the configured registries"
              - heading "Registry Access Issues" [level=3] [ref=f21e687]:
                - link "Registry Access Issues" [ref=f21e688] [cursor=pointer]:
                  - /url: "#registry-access-issues"
                  - text: Registry Access Issues#
              - paragraph [ref=f21e689]: "If components aren't loading from registries:"
              - list [ref=f21e690]:
                - listitem [ref=f21e691]:
                  - strong [ref=f21e692]: Check components.json
                  - text: "- Verify registry URLs are correct"
                - listitem [ref=f21e693]:
                  - strong [ref=f21e694]: Test Authentication
                  - text: "- Ensure environment variables are set for private registries"
                - listitem [ref=f21e695]:
                  - strong [ref=f21e696]: Verify Registry
                  - text: "- Confirm the registry is online and accessible"
                - listitem [ref=f21e697]:
                  - strong [ref=f21e698]: Check Namespace
                  - text: "- Ensure namespace syntax is correct ("
