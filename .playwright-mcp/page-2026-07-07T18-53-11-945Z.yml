                    - generic [ref=f21e518]: "\"mcpServers\": {"
                    - generic [ref=f21e519]: "\"shadcn\": {"
                    - generic [ref=f21e520]: "\"command\": \"npx\","
                    - generic [ref=f21e521]: "\"args\": [\"shadcn@latest\", \"mcp\"]"
                    - generic [ref=f21e522]: "}"
                    - generic [ref=f21e523]: "}"
                    - generic [ref=f21e524]: "}"
              - paragraph [ref=f21e525]:
                - text: After adding the configuration, restart Claude Code and run
                - code [ref=f21e526]: /mcp
                - text: to see the shadcn MCP server in the list. If you see
                - code [ref=f21e527]: Connected
                - text: ", you're good to go."
