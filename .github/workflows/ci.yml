# Responsive-system CI (docs/hud-responsive-layout-plan.md §8): keep the
# enforcement island serial, then run each current Chromium spec on its own
# GitHub host. The cross-browser matrix and production accessibility scans
# still expand in Phase 8; current browser coverage must remain blocking.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (enforcement island)
        run: npm run lint

      - name: Scoped strict typecheck (tsconfig.contracts.json)
        run: npm run typecheck:contracts

      - name: Layout/content contract + catalog validation
        run: npm run validate:contracts

      - name: Unit tests
        run: npm run test:unit

  browser:
    name: E2E (${{ matrix.id }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: foundation
            spec: e2e/foundation.spec.ts
          - id: phase2-boundary
            spec: e2e/phase2-boundary.spec.ts
          - id: phase2-completion
            spec: e2e/phase2-completion.spec.ts
          - id: phase3-renderer
            spec: e2e/phase3-renderer.spec.ts
          - id: phase4-hud
            spec: e2e/phase4-hud.spec.ts
          - id: phase5-fit
            spec: e2e/phase5-fit.spec.ts
          - id: phase5-input
            spec: e2e/phase5-input.spec.ts
          - id: smoke
            spec: e2e/smoke.spec.ts
          - id: turntable-tether
            spec: e2e/turntable-tether.spec.ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Browser tests run against a dev server (Playwright webServer):
      # __COCKPIT_TEST_HOOKS__ is compiled out of production builds by
      # design — see components/cockpit/test-hooks.ts and
      # docs/responsive-system.md. Phase 8 adds the production-build gate
      # asserting the bridge is absent from the shipped artifact.
      - name: Browser test (Chromium)
        run: npm run test:e2e -- ${{ matrix.spec }}
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
